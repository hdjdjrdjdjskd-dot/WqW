name: RDP 24-7 Infinito

on:
  workflow_dispatch:
  repository_dispatch:
    types: [reiniciar_rdp]

jobs:
  secure-rdp:
    runs-on: windows-latest

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: cmd
        run: |
          net user RDP Pc2026Virt /add /y
          net localgroup Administrators RDP /add

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://tailscale.com" -OutFile "C:\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "C:\tailscale.msi", "/quiet", "/norestart" -Wait
          Remove-Item "C:\tailscale.msi" -Force

      - name: Establish Tailscale Connection
        run: |
          & "\(env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=\){{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-\(env:GITHUB_RUN_ID\)tsIP = \(null\)retries = 0
          while (-not tsIP -and retries -lt 10) {
              \(tsIP = & "\)env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              \$retries++
          }
          if (-not \$tsIP) { exit 1 }
          echo "TAILSCALE_IP=tsIP" >> env:GITHUB_ENV

      - name: Maintain Connection & Auto-Trigger Next Machine
        env:
          GH_TOKEN: \${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO_OWNER: \${{ github.repository_owner }}
          REPO_NAME: \${{ github.event.repository.name }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: \$env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Pc2026Virt"
          Write-Host "==================`n"

          $maxSeconds = 20700
          $elapsed = 0
          $interval = 300

          while ($elapsed -lt $maxSeconds) {
              Write-Host "[$(Get-Date)] RDP Active - Repitiendo ciclo..."
              Start-Sleep -Seconds $interval
              $elapsed += $interval
          }

          Write-Host "Límite de tiempo cerca. Invocando nueva máquina..."
          
          $body = @{ event_type = "reiniciar_rdp" } | ConvertTo-Json
          $headers = @{
              "Authorization" = "token $env:GH_TOKEN"
              "Accept"        = "application/vnd.github.v3+json"
          }
          
          Invoke-RestMethod -Uri "https://github.com" `
                            -Method Post -Headers headers -Body body -ContentType "application/json"
