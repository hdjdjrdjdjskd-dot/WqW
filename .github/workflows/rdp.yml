name: RDP 24-7 Infinito

on:
  workflow_dispatch:
  repository_dispatch:
    types: [reiniciar_rdp]

jobs:
  secure-rdp:
    runs-on: windows-latest

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: cmd
        run: |
          net user RDP Pc2026Virt /add /y
          net localgroup Administrators RDP /add

      - name: Install Tailscale via Chocolatey
        shell: cmd
        run: |
          choco install tailscale -y

      - name: Establish Tailscale Connection
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=\({{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-\){{ github.run_id }}

      - name: Maintain Connection & Auto-Trigger Next Machine
        env:
          GH_TOKEN: \${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO_OWNER: \${{ github.repository_owner }}
          REPO_NAME: \${{ github.event.repository.name }}
        run: |
          \$tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: \$tsIP"
          Write-Host "Username: RDP"
          Write-Host "Password: Pc2026Virt"
          Write-Host "==================`n"

          $maxSeconds = 20700
          $elapsed = 0
          $interval = 300

          while ($elapsed -lt $maxSeconds) {
              Write-Host "[$(Get-Date)] RDP Active - Repitiendo ciclo..."
              Start-Sleep -Seconds $interval
              $elapsed += $interval
          }

          Write-Host "Límite de tiempo cerca. Invocando nueva máquina..."
          
          $body = @{ event_type = "reiniciar_rdp" } | ConvertTo-Json
          $headers = @{
              "Authorization" = "token $env:GH_TOKEN"
              "Accept"        = "application/vnd.github.v3+json"
          }
          
          Invoke-RestMethod -Uri "https://github.com" `
                            -Method Post -Headers headers -Body body -ContentType "application/json"
