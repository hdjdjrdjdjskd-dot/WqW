name: RDP 24-7 Infinito Ngrok

on:
  workflow_dispatch:
  repository_dispatch:
    types: [reiniciar_rdp]

jobs:
  secure-rdp:
    runs-on: windows-latest

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        shell: cmd
        run: |
          net user RDP Pc2026Virt /add /y
          net localgroup Administrators RDP /add

      - name: Install and Configure Ngrok
        shell: cmd
        run: |
          choco install ngrok -y
          "C:\ProgramData\chocolatey\bin\ngrok.exe" config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Start Ngrok Tunnel
        shell: cmd
        run: |
          start /b "" "C:\ProgramData\chocolatey\bin\ngrok.exe" tcp 3389

      - name: Maintain Connection & Auto-Trigger Next Machine
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          Write-Host "`n=== RDP ACCESS VIA NGROK ==="
          Write-Host "Username: RDP"
          Write-Host "Password: Pc2026Virt"
          Write-Host "Entra a tu panel de ngrok.com -> 'Endpoints' para ver la IP y Puerto."
          Write-Host "============================`n"

          $maxSeconds = 20700
          $elapsed = 0
          $interval = 300

          while ($elapsed -lt $maxSeconds) {
              Write-Host "[$(Get-Date)] RDP Active - Repitiendo ciclo..."
              Start-Sleep -Seconds $interval
              $elapsed += $interval
          }

          Write-Host "Límite de tiempo cerca. Invocando nueva máquina..."
          $body = @{ event_type = "reiniciar_rdp" } | ConvertTo-Json
          $headers = @{
              "Authorization" = "token $env:GH_TOKEN"
              "Accept"        = "application/vnd.github.v3+json"
          }
          Invoke-RestMethod -Uri "https://github.com" `
                            -Method Post -Headers headers -Body body -ContentType "application/json"
